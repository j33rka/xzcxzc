<!doctype html>

    <style>
        :root {
            color-scheme: light;
            --bg: #e9edf3;
            --line: #e8edf2;
            --muted: #7d8996;
            --blue: #d9fdd3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: #17212b;
            font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Arial, sans-serif;
        }

        .app {
            display: flex;
            flex-direction: column;
            max-width: 980px;
            min-height: 100vh;
            margin: auto;
            background: #fff;
            box-shadow: 0 0 28px #1b2a3a12;
        }

        .top {
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 15px 18px 12px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .headrow {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            display: grid;
            flex: none;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #91c8ff, #c5a8ff);
            color: white;
            font-size: 17px;
            font-weight: 700;
        }

        .name {
            font-size: 17px;
            font-weight: 700;
        }

        .sub {
            color: var(--muted);
            font-size: 12px;
        }

        .search {
            margin-top: 12px;
        }

        .search input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
            background: #f5f7fa;
            font: inherit;
        }

        .search input:focus {
            border-color: #9dc8f7;
            background: #fff;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 18px;
            border-bottom: 1px solid var(--line);
            background: #fafbfd;
            color: var(--muted);
            font-size: 12px;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding: 18px clamp(12px, 4vw, 42px) 35px;
        }

        .day {
            align-self: center;
            margin: 12px 0 7px;
            padding: 5px 12px;
            border-radius: 20px;
            background: #eef2f6;
            color: #687585;
            font-size: 11px;
        }

        .msg {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: fit-content;
            max-width: min(76%, 650px);
            min-width: 0;
            flex: 0 1 auto;
            padding: 9px 12px 7px;
            border-radius: 15px;
            box-shadow: 0 1px 1px #18253612;
            overflow-wrap: anywhere;
            text-align: left;
        }

        .msg.me {
            align-self: flex-end;
            border-bottom-right-radius: 5px;
            background: var(--blue);
        }

        .msg.them {
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            background: #f0f2f5;
        }


        .msg.red-mark {
            background: #ffd9d9 !important;
            border: 1px solid #f0aaaa;
            color: #542222;
        }

        .msg.red-mark .body,
        .msg.red-mark .time {
            color: #542222;
        }

        .msg.red-mark .time {
            opacity: .72;
        }

        .sender {
            margin-bottom: 3px;
            color: #2787a9;
            font-size: 11px;
            font-weight: 700;
        }

        .body {
            display: block;
            width: auto;
            min-width: 0;
            margin: 0;
            padding: 0;
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: normal;
            line-height: 1.4;
        }

        .time {
            margin-top: 4px;
            color: #77838e;
            font-size: 10px;
            text-align: right;
        }

        .attachments {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 7px;
        }

        .att {
            color: #526273;
            font-size: 13px;
        }

        .att a {
            color: #1874c9;
            text-decoration: none;
        }

        .att a:hover {
            text-decoration: underline;
        }

        .photo {
            display: block;
            max-width: min(100%, 420px);
            max-height: 420px;
            border-radius: 10px;
            background: #e5e9ee;
            object-fit: contain;
            cursor: zoom-in;
        }

        .photo-link {
            display: inline-block;
            max-width: 100%;
        }

        .empty {
            padding: 50px 12px;
            color: var(--muted);
            text-align: center;
        }

        .bottom {
            padding: 12px 18px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 11px;
            text-align: center;
        }

        .viewer {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #07111def;
            cursor: zoom-out;
        }

        .viewer.open {
            display: flex;
        }

        .viewer img {
            max-width: 96vw;
            max-height: 94vh;
            border-radius: 8px;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            html, body {
                width: 100%;
                min-width: 0;
                overflow-x: hidden;
            }

            .app {
                width: 100%;
                max-width: 100%;
                min-height: 100vh;
                min-height: 100dvh;
                overflow-x: hidden;
            }

            .top {
                padding: 12px;
            }

            .headrow,
            .name,
            .sub {
                min-width: 0;
                overflow-wrap: anywhere;
            }

            .search input {
                display: block;
                width: 100%;
                min-width: 0;
                font-size: 16px;
            }

            .toolbar {
                padding: 8px 12px;
            }

            .messages {
                width: 100%;
                min-width: 0;
                gap: 6px;
                padding: 12px 9px 25px;
            }

            .msg {
                width: fit-content;
                max-width: 86%;
                min-width: 0;
                padding: 8px 11px 6px;
            }

            .body {
                font-size: 14px;
                line-height: 1.38;
            }

            .attachments,
            .att,
            .photo-link {
                max-width: 100%;
                min-width: 0;
                overflow-wrap: anywhere;
            }

            .photo {
                max-width: 100%;
                height: auto;
            }

            .bottom {
                padding: 10px 12px;
            }
        }
    </style>
</head>

        const root = document.getElementById("messages");
        const input = document.getElementById("search");
        const count = document.getElementById("count");
        const viewer = document.getElementById("viewer");
        const viewerImage = document.getElementById("viewerImg");

        // Безопасно экранирует текст перед вставкой в HTML.
        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };

                return entities[character];
            });
        }

        // Создаёт HTML для вложений сообщения.
        function renderAttachment(attachment) {
            const description = escapeHtml(attachment.description);

            if (attachment.is_image && attachment.url) {
                const url = escapeHtml(attachment.url);

                return `
                    <a
                        class="photo-link"
                        href="${url}"
                        data-photo="${url}"
                        aria-label="Открыть фотографию"
                    >
                        <img
                            class="photo"
                            loading="lazy"
                            decoding="async"
                            src="${url}"
                            alt="${description || "Фотография"}"
                            onerror="
                                this.style.display = 'none';
                                this.parentElement.insertAdjacentHTML(
                                    'beforeend',
                                    '<span class=att>Изображение недоступно · ' +
                                    '<a target=_blank rel=noopener href=&quot;${url}&quot;>' +
                                    'открыть ссылку</a></span>'
                                );
                            "
                        >
                    </a>
                `;
            }

            if (attachment.url) {
                return `
                    <div class="att">
                        📎 ${description} ·
                        <a
                            href="${escapeHtml(attachment.url)}"
                            target="_blank"
                            rel="noopener"
                        >Открыть</a>
                    </div>
                `;
            }

            return `<div class="att">📎 ${description}</div>`;
        }

        // Создаёт HTML одного сообщения.
        function renderMessage(message) {
            const messageElement = document.createElement("article");
            const side = message.sender === "Вы" ? "me" : "them";

            messageElement.className = `msg ${side}`;
            if (["1099294", "1099295", "1099296", "1099297", "1099298", "1099299", "1099300", "1099301", "1099302", "1099303", "1099304", "1099306", "1099307", "1099308", "1099309", "1099310", "1099311", "1099312"].includes(String(message.id))) {
                messageElement.classList.add("red-mark");
            }

            let content = "";

            if (message.sender !== "Вы") {
                content += `
                    <div class="sender">
                        ${escapeHtml(message.sender)}
                    </div>
                `;
            }

            if (message.text) {
                content += `<div class="body">${escapeHtml(message.text)}</div>`;
            }

            if (message.attachments.length > 0) {
                const attachmentsHtml = message.attachments
                    .map(renderAttachment)
                    .join("");

                content += `
                    <div class="attachments">
                        ${attachmentsHtml}
                    </div>
                `;
            }

            content += `
                <div class="time">
                    ${escapeHtml(message.time || "")}
                </div>
            `;

            messageElement.innerHTML = content;
            return messageElement;
        }

        // Отображает сообщения с учётом поискового запроса.
        function renderMessages() {
            const query = input.value.trim().toLocaleLowerCase("ru");

            const filteredMessages = DATA.filter(message => {
                const attachmentText = message.attachments
                    .map(item => `${item.description} ${item.label}`)
                    .join(" ");

                const searchableText = [
                    message.sender,
                    message.text,
                    message.header,
                    attachmentText
                ]
                    .join(" ")
                    .toLocaleLowerCase("ru");

                return !query || searchableText.includes(query);
            });

            count.textContent =
                `${filteredMessages.length.toLocaleString("ru-RU")} из ` +
                `${DATA.length.toLocaleString("ru-RU")} сообщений`;

            root.innerHTML = "";

            let previousDate = "";

            for (const message of filteredMessages) {
                // Добавляет разделитель при переходе к новой дате.
                if (message.date && message.date !== previousDate) {
                    const dateElement = document.createElement("div");

                    dateElement.className = "day";
                    dateElement.textContent = message.date;

                    root.appendChild(dateElement);
                    previousDate = message.date;
                }

                root.appendChild(renderMessage(message));
            }

            if (filteredMessages.length === 0) {
                root.innerHTML = `
                    <div class="empty">Ничего не найдено</div>
                `;
            }
        }

        // Открывает фотографию в полноэкранном просмотрщике.
        root.addEventListener("click", event => {
            const photoLink = event.target.closest("[data-photo]");

            if (!photoLink) {
                return;
            }

            event.preventDefault();
            viewerImage.src = photoLink.dataset.photo;
            viewer.classList.add("open");
        });

        // Закрывает просмотр фотографии нажатием или клавишей Escape.
        function closeViewer() {
            viewer.classList.remove("open");
            viewerImage.removeAttribute("src");
        }

        viewer.addEventListener("click", closeViewer);

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                closeViewer();
            }
        });

        // Обновляет список при вводе поискового запроса.
        input.addEventListener("input", renderMessages);

        // Первоначальная отрисовка переписки.
        renderMessages();
    </script>
